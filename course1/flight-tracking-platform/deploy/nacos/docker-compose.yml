version: '3.8'
services:
  nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: flight-nacos
    environment:
      - MODE=standalone
      - JVM_XMS=512m
      - JVM_XMX=512m
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    volumes:
      - ./data:/home/nacos/data
      - ./logs:/home/nacos/logs
    networks:
      - flight-network

networks:
  flight-network:
    driver: bridge
