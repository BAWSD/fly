server:
  port: 18080

spring:
  application:
    name: api-gateway
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: flight-info-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/flight/info/**
        - id: flight-status-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/flight/status/**
        - id: flight-status-ws
          uri: http://localhost:8082
          predicates:
            - Path=/ws-flight/**
        - id: airport-map-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/airport/**
        - id: data-collector-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/collector/**
        - id: ai-analysis-service
          uri: http://localhost:5000
          predicates:
            - Path=/api/ai/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: "*"
            allowed-methods: "*"
            allowed-headers: "*"
            allow-credentials: true
